name: Test error handling - no package.json
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git user and remove package.json
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

          # Remove package.json if it exists so standard-version has no version to read
          rm -f package.json
          # Also remove any .versionrc files
          rm -f .versionrc .versionrc.json .versionrc.js .versionrc.cjs

      - id: action
        uses: .
        continue-on-error: true

      - name: Assert action failed gracefully without package.json
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Without a package.json, standard-version should fail
          # The action should call core.setFailed (not throw uncaught)
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected when no package.json is present"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (workspace may have a package.json from the action itself)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
